<style>

nav{max-width:560px;margin:0 auto}
.cols,.mgrid{display:grid;gap:0 24px;align-items:start;grid-template-columns:minmax(0,1fr)}

.cols>.a{grid-area:a}.cols>.b{grid-area:b}.cols>.c{grid-area:c}

}

<body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ===== STEP 1: Paste your Firebase web app config here (see README steps) ===== */
const FB_CONFIG = {
  apiKey: "AIzaSyB_T8eFtcYqG1CGM_E_GbjiLjZPtc_VG7o",
  authDomain: "habit-tracker-a17d2.firebaseapp.com",
  projectId: "habit-tracker-a17d2",
  storageBucket: "habit-tracker-a17d2.firebasestorage.app",
  messagingSenderId: "382936932625",
  appId: "1:382936932625:web:57aea9b4c1e02ea2342cb0",
  measurementId: "G-DL1SS2EXE9"
}; // e.g. {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}
/* ============================================================================== */
const Q=["Small steps every day add up to big change.","You don't have to be perfect, just consistent.","Focus on today. Tomorrow will thank you.","Discipline is choosing what you want most over what you want now.","Done is better than perfect.","Progress, not perfection.","Show up even when you don't feel like it.","Your future self is watching. Make them proud.","One habit at a time, one day at a time.","Energy flows where attention goes.","Start where you are. Use what you have.","Motivation gets you started; habit keeps you going.","Be the person your goals need.","Every tick is a vote for who you want to become.","Slow growth is still growth.","Do it tired. Do it scared. Just do it.","Focused, intentional, and ready for the day ahead.","The best time to start was yesterday. The next best is now.","Consistency beats intensity.","Make today count."];
const COL=['var(--b)','var(--p)','var(--t)','var(--y)','var(--b)'];
const $=s=>document.querySelector(s),K='habit_tracker_v1';
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{habits:[],logs:{},todos:[],u:0};
let pend=null,dday=new Date(),view='daily',cur=new Date(),user=null,ref=null,qi=Math.floor(Math.random()*Q.length),status='local';
const act=()=>S.habits.filter(h=>!h.x),today=()=>ds(new Date());
const nm=s=>String(s).toLowerCase().replace(/[^a-z0-9\u0d00-\u0d7f]+/g,'');
function nz(){S.mh=S.mh||[];S.md=S.md||{};S.notes=S.notes||{};S.mh.forEach(x=>{if(!x.x&&!lk(x)){const h=S.habits.find(z=>!z.x&&nm(z.name)==nm(x.name));if(h)x.h=h.id}})}
const lk=x=>!!x.h&&S.habits.some(h=>h.id==x.h&&!h.x);
function cnt(k,h){let c=0;for(let i=1;i<=31;i++)if(isOn(k+'-'+pad(i),h))c++;return c}
const mDone=(x,k)=>lk(x)?cnt(k,x.h)>0:!!(S.md[k]&&S.md[k][x.id]);
function addM(n,h){const e=S.mh.find(x=>(h&&x.h==h)||nm(x.name)==nm(n));if(e){e.x=false;if(h&&!lk(e))e.h=h;return}S.mh.push({id:uid(),name:n,h:h||''})}
function askM(n,h){const e=S.mh.find(x=>!x.x&&nm(x.name)==nm(n));if(e&&!lk(e))e.h=h}
const isOn=(d,h)=>!!(S.logs[d]&&S.logs[d][h]);
function setLog(d,h,v){S.logs[d]=S.logs[d]||{};if(v)S.logs[d][h]=1;else delete S.logs[d][h]}
function save(){S.u=Date.now();localStorage.setItem(K,JSON.stringify(S));push();render()}
function push(){if(ref)ref.set({data:JSON.stringify(S)}).then(()=>{status='synced';sy()}).catch(()=>{status='offline';sy()})}
function sy(){const e=$('#sy');if(e)e.innerHTML=syncHtml()}
function syncHtml(){
  if(!FB_CONFIG)return 'Saved on this device only. <span class="tag">Set up sync to use on phone + laptop</span>';
  if(!user)return '<button data-a="in">Sign in with Google to sync</button>';
  return status=='offline'?'Offline, will sync later':''}
function initFB(){
  if(!FB_CONFIG||typeof firebase==='undefined')return;
  firebase.initializeApp(FB_CONFIG);const db=firebase.firestore();
  firebase.auth().onAuthStateChanged(u=>{user=u;
    if(!u){ref=null;render();return}
    ref=db.collection('users').doc(u.uid);
    ref.onSnapshot(s=>{
      const r=s.exists?JSON.parse(s.data().data):null;
      if(r&&r.u>S.u){S=r;localStorage.setItem(K,JSON.stringify(S));status='synced';render()}
      else if(!r||S.u>r.u)push();
      else{status='synced';sy()}
    },()=>{status='offline';sy()});
    render()})}
function streak(h){let c=0,d=new Date();if(!isOn(ds(d),h))d.setDate(d.getDate()-1);while(isOn(ds(d),h)){c++;d.setDate(d.getDate()-1)}return c}
function pct(d){const a=act();return a.length?Math.round(a.filter(h=>isOn(d,h.id)).length/a.length*100):0}
function vTodo(){
  const d=today(),a=act(),p=pct(d);
  const tl=S.todos.filter(t=>t.date==d||(t.date<d&&!t.done));
  const up=S.todos.filter(t=>t.date>d&&!t.done).sort((x,y)=>x.date<y.date?-1:1);
  const opts=a.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');
  return `<div class="box"><h2>To-do today</h2>${tl.length?tl.map(t=>{const h=S.habits.find(x=>x.id==t.h);return `<div class="row ${t.done?'done':''}"><button class="chk ${t.done?'on':''}" style="--c:var(--p)" data-a="tt" data-i="${t.id}" aria-label="Toggle task"></button><span class="n">${esc(t.text)} ${h?`<span class="tag">${esc(h.name)}</span>`:''}${t.date<d?'<span class="tag">carried over</span>':''}</span>${!t.h?`<button class="ghost" data-a="mh" data-i="${t.id}">+ Habit</button>`:''}<button class="ghost" data-a="dt" data-i="${t.id}" aria-label="Delete task">✕</button></div>`}).join(''):'<p class="empty">Nothing planned yet. Add your first task below.</p>'}
  <div class="add"><input id="nt" placeholder="What do you need to do today?"><input type="date" id="nd" value="${d}" style="flex:0 0 auto"><select id="nh"><option value="">No habit link</option>${opts}<option value="__new">+ Also make it a habit</option></select><button data-a="at">Add task</button></div></div>
  ${up.length?`<div class="box"><h2>Upcoming</h2>${up.map(t=>`<div class="row"><span class="n">${esc(t.text)} <span class="tag">${t.date}</span></span><button class="ghost" data-a="dt" data-i="${t.id}" aria-label="Delete task">✕</button></div>`).join('')}</div>`:''}`}
function twice(k){if(pend==k){pend=null;return true}pend=k;render();setTimeout(()=>{if(pend==k){pend=null;render()}},4000);return false}
function vDaily(){
  const d=ds(dday),a=act(),n=a.filter(h=>isOn(d,h.id)).length,p=a.length?Math.round(n/a.length*100):0,t=d==today();
  return `<div class="mnav"><button data-a="dprev" aria-label="Previous day">‹</button><b>${dday.toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</b><button data-a="dnext" aria-label="Next day" ${t?'disabled':''}>›</button></div>${t?'':'<p style="text-align:center;margin-bottom:12px"><button data-a="dtoday">Back to today</button></p>'}
  <div class="box"><div class="top"><div class="ring" style="--v:${p}"><span>${p}%</span></div><div><h2>Daily habits</h2><p>${n} of ${a.length} done</p></div></div><div class="add" style="margin-top:12px"><button data-a="rd">${pend=='rd'?'Tap again to clear':'Reset this day'}</button></div></div>
  ${a.length?a.map((h,i)=>`<button class="drow ${isOn(d,h.id)?'on':''}" data-a="tg" data-h="${h.id}" data-d="${d}" style="--c:${COL[i%4]}"><span class="dbox"></span><span class="n">${esc(h.name)}${streak(h.id)>0?` <span class="tag st">${streak(h.id)}-day streak</span>`:''}</span></button>`).join(''):'<p class="empty">No habits yet. Add your first one in "My habits".</p>'}`}
function vMonthly(k){
  const L=S.mh.filter(x=>!x.x),miss=act().filter(h=>!L.some(x=>x.h==h.id));
  const dn=L.filter(x=>mDone(x,k)).length,p=L.length?Math.round(dn/L.length*100):0;
  return `<div class="box g-mon"><h2>Monthly habits</h2><p class="empty">${dn} / ${L.length} completed · ${p}%</p>${L.map(x=>{const l=lk(x),on=mDone(x,k);return `<div class="row ${on?'done':''}"><button class="chk ${on?'on':''}" style="--c:var(--p)" data-a="tm" data-i="${x.id}" data-k="${k}" ${l?'disabled':''} aria-label="${esc(x.name)}"></button><span class="n">${esc(x.name)} ${l?`<span class="tag">from daily · ${cnt(k,x.h)} days</span>`:''}</span></div>`}).join('')||'<p class="empty">No monthly habits yet.</p>'}</div>`}
function vMonth(){
  const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),a=act();
  const days=[...Array(n)].map((_,i)=>i+1),dd=i=>y+'-'+pad(m+1)+'-'+pad(i);
  let tot=0;
  const rows=a.map(h=>{let c=0;const cells=days.map(i=>{const on=isOn(dd(i),h.id);if(on)c++;return `<td><button class="chk ${on?'on':''}" style="--c:${COL[Math.floor((i-1)/7)]}" data-a="tg" data-h="${h.id}" data-d="${dd(i)}" aria-label="${esc(h.name)} ${i}"></button></td>`}).join('');tot+=c;return `<tr><td class="h">${esc(h.name)}</td>${cells}<td class="pc">${Math.round(c/n*100)}%</td></tr>`}).join('');
  const p=a.length?Math.round(tot/(n*a.length)*100):0;
  const wk=[0,1,2,3,4].map(w=>{let c=0,t=0;days.filter(i=>Math.floor((i-1)/7)==w).forEach(i=>{t+=a.length;a.forEach(h=>{if(isOn(dd(i),h.id))c++})});return t?`<div class="ring" style="--v:${Math.round(c/t*100)};--b:${COL[w]};width:84px;height:84px"><span style="width:64px;height:64px;font-size:19px">${Math.round(c/t*100)}%</span></div>`:''}).join('');
  return `<div class="mnav"><button data-a="pm">‹</button><b>${cur.toLocaleString('en',{month:'long'})} ${y}</b><button data-a="nm">›</button></div>
  <div class="mgrid"><div class="box g-prog"><div class="top"><div class="ring" style="--v:${p}"><span>${p}%</span></div><div><h2>Month progress</h2><p>Weekly:</p></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">${wk}</div></div>
  <div class="box g-grid"><h2>Daily habits</h2>${a.length?`<div class="scroll"><table><tr><th class="h"></th>${days.map(i=>`<th class="d" style="background:${COL[Math.floor((i-1)/7)]}">${i}</th>`).join('')}<th></th></tr>${rows}</table></div>`:'<p class="empty">Add habits on the Daily Habits page.</p>'}</div>${vMonthly(y+'-'+pad(m+1))}<div class="box g-ref"><h2>Monthly reflection</h2><textarea id="rf" rows="5" placeholder="What went well? What will you change next month?">${esc((S.notes||{})[y+'-'+pad(m+1)]||'')}</textarea></div>`}
function vManage(){
  return `<div class="box"><h2>My habits</h2>${act().map(h=>`<div class="row"><input class="hn" data-h="${h.id}" value="${esc(h.name)}" aria-label="Habit name"><span class="tag">streak ${streak(h.id)}</span>${S.mh.some(x=>!x.x&&x.h==h.id)?'':`<button class="ghost" data-a="h2m" data-h="${h.id}">+ Monthly</button>`}<button class="ghost" data-a="ah" data-h="${h.id}">Archive</button><button class="ghost" data-a="dh" data-h="${h.id}">${pend==h.id?'Tap again to delete':'Delete'}</button></div>`).join('')||'<p class="empty">No habits yet.</p>'}
  <div class="add"><input id="nhb" placeholder="New habit, e.g. 3 L water"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="nhm" style="flex:0 0 auto;width:auto"> Also monthly</label><button data-a="addh">Add habit</button></div></div>
  ${S.habits.some(h=>h.x)?`<div class="box"><h2>Archived</h2><p class="empty">Past data is kept safe.</p>${S.habits.filter(h=>h.x).map(h=>`<div class="row"><span class="n">${esc(h.name)}</span><button class="ghost" data-a="rh" data-h="${h.id}">Restore</button><button class="ghost" data-a="dh" data-h="${h.id}">${pend==h.id?'Tap again to delete':'Delete'}</button></div>`).join('')}</div>`:''}`}
function vMonthSet(){
  return `<div class="box g-man"><h2>Monthly habits</h2>${S.mh.filter(x=>!x.x).map(x=>`<div class="row"><span class="n">${esc(x.name)}</span><button class="ghost" data-a="rm" data-i="${x.id}">Remove</button></div>`).join('')||'<p class="empty">None yet.</p>'}<div class="add"><input id="nmb" placeholder="New monthly habit"><button data-a="addm">Add monthly habit</button></div></div>
  <div class="box g-bak"><h2>Backup and display</h2><div class="add"><button data-a="ex">Export backup</button><button data-a="im">Import backup</button><button data-a="rmo">${pend=='rmo'?'Tap again to reset':'Reset '+cur.toLocaleString('en',{month:'long'})}</button><button data-a="dm">Light / dark mode</button>${user?'<button data-a="out">Sign out</button>':''}</div><input type="file" id="fi" accept=".json" hidden></div>`}
function vPage1(){const h=vDaily(),i=h.indexOf('<div class="box">');return h.slice(0,i)+'<div class="cols"><section class="a">'+h.slice(i)+'</section><section class="b">'+vTodo()+'</section><section class="c">'+vManage()+'</section></div>'}
function vPage2(){return vMonth()+vMonthSet()+'</div>'}
function render(){nz();
  const f=document.activeElement&&document.activeElement.id,v=f&&document.activeElement.value;
  const n=new Date();
  $('#app').innerHTML=`<header><div class="mo">${(view=='month'?cur:n).toLocaleString('en',{month:'long'})}</div><div class="sub">HABIT TRACKER</div><div class="quote">“${Q[qi]}”</div><div class="sync" id="sy">${syncHtml()}</div></header>${view=='month'?vPage2():vPage1()}<nav>${[['daily','Daily Habits'],['month','Monthly Habits']].map(t=>`<button data-a="tab" data-v="${t[0]}" class="${view==t[0]?'on':''}">${t[1]}</button>`).join('')}</nav>`;
  if(f&&$('#'+f)){$('#'+f).value=v}}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
  if(a=='tab'){view=D.v;render();window.scrollTo(0,0)}
  else if(a=='tg'){setLog(D.d,D.h,!isOn(D.d,D.h));save()}
  else if(a=='tt'){const t=S.todos.find(x=>x.id==D.i);t.done=!t.done;if(t.h)setLog(t.date<today()&&t.done?today():t.date,t.h,t.done);if(t.done)t.doneOn=today();save()}
  else if(a=='dt'){S.todos=S.todos.filter(x=>x.id!=D.i);save()}
  else if(a=='at'){const v=$('#nt').value.trim();if(!v)return;let hv=$('#nh').value;if(hv=='__new'){const ex=S.habits.find(x=>x.name.toLowerCase()==v.toLowerCase());if(ex){ex.x=false;hv=ex.id}else{hv=uid();S.habits.push({id:hv,name:v});askM(v,hv)}}S.todos.push({id:uid(),text:v,date:$('#nd').value||today(),done:false,h:hv});save()}
  else if(a=='mh'){const t=S.todos.find(x=>x.id==D.i);let h=S.habits.find(x=>x.name.toLowerCase()==t.text.toLowerCase());if(!h){h={id:uid(),name:t.text};S.habits.push(h);askM(h.name,h.id)}else h.x=false;t.h=h.id;if(t.done)setLog(t.date,h.id,true);save()}
  else if(a=='addh'){const v=$('#nhb').value.trim();if(!v)return;const hid=uid();S.habits.push({id:hid,name:v});askM(v,hid);if($('#nhm').checked)addM(v,hid);save()}
  else if(a=='ah'||a=='rh'){S.habits.find(x=>x.id==D.h).x=a=='ah';save()}
  else if(a=='tm'){const x=S.mh.find(z=>z.id==D.i);S.md[D.k]=S.md[D.k]||{};if(S.md[D.k][x.id])delete S.md[D.k][x.id];else S.md[D.k][x.id]=1;save()}
  else if(a=='am'){act().forEach(h=>addM(h.name,h.id));save()}
  else if(a=='h2m'){const h=S.habits.find(x=>x.id==D.h);addM(h.name,h.id);save()}
  else if(a=='addm'){const v=$('#nmb').value.trim();if(!v)return;const ex=S.habits.find(h=>!h.x&&h.name.toLowerCase()==v.toLowerCase());addM(v,ex?ex.id:'');save()}
  else if(a=='rm'){S.mh=S.mh.filter(x=>x.id!=D.i);save()}
  else if(a=='dh'){const h=S.habits.find(x=>x.id==D.h);if(!h)return;if(pend!=h.id){pend=h.id;render();setTimeout(()=>{if(pend==h.id){pend=null;render()}},4000);return}pend=null;S.habits=S.habits.filter(x=>x.id!=h.id);for(const d in S.logs)delete S.logs[d][h.id];S.mh=S.mh.filter(x=>x.h!=h.id);S.todos.forEach(t=>{if(t.h==h.id)t.h=''});save()}
  else if(a=='rn'){const h=S.habits.find(x=>x.id==D.h),v=prompt('Rename habit',h.name);if(v&&v.trim()){h.name=v.trim();S.mh.forEach(x=>{if(x.h==h.id)x.name=h.name});save()}}
  else if(a=='ex'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='habit-backup-'+today()+'.json';l.click();URL.revokeObjectURL(u)}
  else if(a=='im'){$('#fi').click()}
  else if(a=='dm'){const t=document.documentElement.dataset.t=='dark'?'':'dark';document.documentElement.dataset.t=t;localStorage.setItem('ht_theme',t)}
  else if(a=='rd'){if(twice('rd')){delete S.logs[ds(dday)];save()}}
  else if(a=='rmo'){if(twice('rmo')){const k=ds(cur).slice(0,7);for(const d in S.logs)if(d.startsWith(k))delete S.logs[d];delete S.md[k];save()}}
  else if(a=='dprev'){dday.setDate(dday.getDate()-1);render()}
  else if(a=='dnext'){dday.setDate(dday.getDate()+1);render()}
  else if(a=='dtoday'){dday=new Date();render()}
  else if(a=='pm'){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()}
  else if(a=='nm'){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()}
  else if(a=='in'){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(()=>{status='offline';sy()})}
  else if(a=='out'){firebase.auth().signOut()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){const i=e.target.id;if(i=='nt')document.querySelector('[data-a=at]').click();if(i=='nhb')document.querySelector('[data-a=addh]').click()}});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('hn')){const h=S.habits.find(x=>x.id==e.target.dataset.h),v=e.target.value.trim();if(h&&v){h.name=v;S.mh.forEach(x=>{if(x.h==h.id)x.name=v});save()}}
  if(e.target.id=='rf'){S.notes=S.notes||{};S.notes[ds(cur).slice(0,7)]=e.target.value;save()}
  if(e.target.id=='fi'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.habits))throw 0;if(confirm('Replace current data with this backup?')){S=j;save()}}catch(x){alert('This is not a valid backup file.')}})}});
{const th=localStorage.getItem('ht_theme');document.documentElement.dataset.t=th===null?'dark':th}
render();initFB();
</script></body></html>
